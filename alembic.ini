# Alembic Configuration
# ---------------------------------------------------------------------------
# The actual database URL is injected at runtime from app.core.config.settings
# inside migrations/env.py — keep the placeholder below as-is.

[alembic]
script_location = migrations
prepend_sys_path = .
# Placeholder — overridden in env.py from app.core.config.settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
